name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: omitl-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: omitl-linux-arm64

          # ── macOS ──────────────────────────────────────────────
          - target: x86_64-apple-darwin
            os: macos-latest
            name: omitl-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: omitl-macos-arm64        # Apple Silicon (M1/M2/M3)

          # ── Windows ────────────────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: omitl-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux musl)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux via cross)
        if: contains(matrix.target, 'linux')
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (macOS / Windows native)
        if: "!contains(matrix.target, 'linux')"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.name }}.tar.gz omitl
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
          mv ${{ matrix.name }}.tar.gz ${{ matrix.name }}.tar.gz.sha256 ../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path omitl.exe -DestinationPath ../../../${{ matrix.name }}.zip
          Get-FileHash ../../../${{ matrix.name }}.zip -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            Out-File -FilePath ../../../${{ matrix.name }}.zip.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.name }}.*
